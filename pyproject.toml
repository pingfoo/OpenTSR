[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentsr"
version = "0.0.1"
description = "Open-source, open-data traffic sign recognition (with a secondary traffic light track)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Shared by both tracks (metrics, split manifests). Track-specific packages are extras so that an
# install never mixes the two: `pip install -e ".[signs]"` or `pip install -e ".[lights]"`.
dependencies = [
    "numpy",
    "PyYAML",
]

[project.optional-dependencies]
signs = ["torch", "torchvision", "transformers", "open_clip_torch", "timm", "accelerate", "huggingface-hub", "pyarrow", "pillow", "tqdm"]
lights = ["onnxruntime", "onnx", "opencv-python-headless", "pandas", "pillow", "tqdm", "huggingface-hub"]
train = ["ultralytics", "torch", "torchvision"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
