[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentsr"
version = "0.0.1"
description = "Open-source, open-data traffic sign recognition (with a secondary traffic light track)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "onnxruntime",
    "PyYAML",
]

[project.optional-dependencies]
train = ["ultralytics", "torch", "torchvision"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
